<script>
window.addEventListener('load', () => {
  const ux = document.querySelector('[data-category="ux"]');
  const btn = document.querySelector('[data-filter="ux"]');
  btn.click();
  setTimeout(() => {
    const items = document.querySelectorAll('.ids__sequence-item');
    const report = [];
    items.forEach(i => report.push(i.querySelector('h5').textContent + ' => ' + i.style.display));
    document.body.insertAdjacentHTML('beforeend', '<pre id="R">' + report.join('\n') + '</pre>');
  }, 50);
});
</script>
